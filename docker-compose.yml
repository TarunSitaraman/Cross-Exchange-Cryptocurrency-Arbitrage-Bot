version: '3.8'

services:
  bot:
    build: .
    container_name: quantum_arb_bot
    command: python main.py
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    container_name: quantum_arb_dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - bot
    environment:
      - PYTHONUNBUFFERED=1
